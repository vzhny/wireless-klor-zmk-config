# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#

# minimal-test branch: no ZMK Studio (no ADMIN layer to unlock it from),
# no settings_reset build.
include:
  - board: nice_nano_v2
    shield: klor_left
  - board: nice_nano_v2
    shield: klor_right
  # Temporary: testing whether dozens of flashes/BT pairings this session
  # have left the NVS/settings partition (untouched by normal app UF2
  # flashes) in a state that's delaying/breaking log backend startup,
  # independent of which application firmware is loaded -- a4be99f's UF2
  # is byte-identical to 8de214f's (confirmed via md5) yet behaves
  # differently across flashes, which rules out the application image
  # itself as the cause.
  - board: nice_nano_v2
    shield: settings_reset
