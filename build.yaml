# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#

include:
  - board: nice_nano_v2
    shield: klor_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: klor_right
  # Debug: wipes NVS/bonding data. This session has reflashed the left half
  # many times with very different firmware shapes (behavior/combo/layer
  # counts changing each edit) -- every log capture shows repeated
  # "settings: set-value failure" errors, consistent with NVS holding stale
  # entries the current firmware's schema doesn't expect. Flash this once to
  # rule that out (or fix it) before chasing more code-level theories.
  - board: nice_nano_v2
    shield: settings_reset