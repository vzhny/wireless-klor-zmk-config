# minimal-test branch: kept only so we're not flying blind if this also fails.
CONFIG_ZMK_USB_LOGGING=y

# minimal-test branch: display on, real widget rendering.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_IMG=y
# LV_USE_THEME_MONO defaults on for LV_COLOR_DEPTH_1 (Kconfig.defconfig).
# Without this the theme assumes light-bg/dark-fg, backwards for an OLED.
CONFIG_ZMK_DISPLAY_INVERT=y
# CONFIG_LV_MEM_SIZE_KILOBYTES is not a real Kconfig symbol anywhere in
# zmkfirmware/zmk -- confirmed via `gh api search/code`, zero matches. It's
# been silently ignored by Kconfig this entire session (unrecognized CONFIG_
# lines in a .conf fragment don't error, they're just dropped). The actual
# symbol for this LVGL/Zephyr integration is LV_Z_MEM_POOL_SIZE
# (app/src/display/Kconfig), which only gets a 4096-byte default when
# ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN is selected -- we use CUSTOM, so it's
# been falling through to LVGL's own upstream default of 2048 bytes this
# whole time, confirmed via the CI build's Kconfig dump. 2KB is razor-thin
# for a widget tree with multiple styled objects, custom bitmap fonts, and
# labels -- plausible root cause of the exact "one thing renders, add a
# second and it silently stops working" pattern this whole bisection kept
# hitting, independent of which specific object/font triggered it.
CONFIG_LV_Z_MEM_POOL_SIZE=65536

# Testing: default work-queue choice is ZMK_DISPLAY_WORK_QUEUE_SYSTEM (first
# in the Kconfig choice, no explicit default set upstream) -- UI render runs
# on Zephyr's shared system workqueue thread, not a dedicated one, and its
# stack is thin/shared with other system work (BT, settings). A 2nd styled
# label's worth of extra draw-call stack frames (glyph decode + blit) is the
# one variable every failing test has shared so far, regardless of font,
# container, or helper. Moving UI work to its own thread with a generous
# stack isolates that.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
