# Encoders config
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ZMK Studio (central only) — required for the &studio_unlock binding on the admin layer
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# KLOR OLED Display config
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# LV_USE_THEME_MONO defaults on for LV_COLOR_DEPTH_1 (this shield's
# Kconfig.defconfig). Without this, the theme assumes a light background /
# dark foreground, which is backwards for an OLED and left unstyled
# elements (e.g. the layer-name label) invisible against the real black bg.
CONFIG_ZMK_DISPLAY_INVERT=y
# Defaults to y for SSD1306 (ZMK's app/src/display/Kconfig). Must be off -
# klor_display_power.c is the sole blanking authority (connection-state
# driven); the stock idle-blank fights it for the same panel and also stops
# the LVGL tick timer while blanked, which is what caused the white screen.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# klor_central_widget.c's LVGL rendering (flex layout, multiple badges) plus
# klor_modifier_sync_central.c's GATT writes run on the display work queue.
# On the shared system queue (default), that's sharing a stack with BLE/USB
# event processing -- a stack overflow there could take BT/USB down with it.
# Dedicated queue isolates it with its own stack.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# Default (2048B) is likely too tight: zmk_display_status_screen() and
# klor_central_widget_init() run on this same queue/thread synchronously,
# creating ~15 badges (30 LVGL objects) with flex layout in one call chain.
# BT/USB dying intermittently as unrelated code nearby changed size (e.g.
# adding a few LOG_DBG calls) is the signature of a marginal stack overflow,
# not a specific logic bug -- bumping generously.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
# MPU-based overflow detection: if 8192 still isn't enough, this turns
# silent memory corruption (the "everything just dies, no log" pattern
# we've been chasing) into a clean fatal-error report instead.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_LV_FONT_MONTSERRAT_8=y
CONFIG_LV_FONT_UNSCII_8=y
# ZMK implies LV_CONF_MINIMAL=y whenever display is on, which defaults these
# three off. klor_widgets_util.c/klor_central_widget.c need all three: flex
# for the badge rows, label for badge/layer text, img for the face icon.
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMG=y

CONFIG_ZMK_USB_LOGGING=y
