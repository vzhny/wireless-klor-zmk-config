# minimal-test branch: kept only so we're not flying blind if this also fails.
CONFIG_ZMK_USB_LOGGING=y

# minimal-test branch: display on, real widget rendering.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_IMG=y
# LV_USE_THEME_MONO defaults on for LV_COLOR_DEPTH_1 (Kconfig.defconfig).
# Without this the theme assumes light-bg/dark-fg, backwards for an OLED.
CONFIG_ZMK_DISPLAY_INVERT=y
# Default 32KB. ~15 fully-styled badges (30 objects, several individual
# lv_obj_set_style_*() calls each) is a much bigger one-time allocation than
# the single-badge test that worked (step 5) -- if the pool's exhausted,
# lv_obj_create() returns NULL and the next lv_obj_set_style_*() on it is a
# null-deref hard fault. If Zephyr resets on that, it'd boot-loop: LED still
# blinks each cycle, screen shows partial/garbage writes each time, BT/USB
# never finish initializing because the crash-reset lands before they do --
# matches every symptom so far. Testing with room to spare.
CONFIG_LV_MEM_SIZE_KILOBYTES=64
