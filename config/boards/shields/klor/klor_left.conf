# Encoders config
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ZMK Studio (central only) — required for the &studio_unlock binding on the admin layer
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# KLOR OLED Display config
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# LV_USE_THEME_MONO defaults on for LV_COLOR_DEPTH_1 (this shield's
# Kconfig.defconfig). Without this, the theme assumes a light background /
# dark foreground, which is backwards for an OLED and left unstyled
# elements (e.g. the layer-name label) invisible against the real black bg.
CONFIG_ZMK_DISPLAY_INVERT=y
# Defaults to y for SSD1306 (ZMK's app/src/display/Kconfig). Must be off -
# klor_display_power.c is the sole blanking authority (connection-state
# driven); the stock idle-blank fights it for the same panel and also stops
# the LVGL tick timer while blanked, which is what caused the white screen.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_LV_FONT_MONTSERRAT_8=y
CONFIG_LV_FONT_UNSCII_8=y
# ZMK implies LV_CONF_MINIMAL=y whenever display is on, which defaults these
# three off. klor_widgets_util.c/klor_central_widget.c need all three: flex
# for the badge rows, label for badge/layer text, img for the face icon.
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMG=y

CONFIG_ZMK_USB_LOGGING=y
