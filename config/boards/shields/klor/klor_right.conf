# Display on, klor_peripheral_widget.c rendering (LINKED/BAT/% badges +
# face icon + static mod row -- live mod sync not wired up yet).
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_IMG=y
CONFIG_ZMK_DISPLAY_INVERT=y

# Same two root-cause fixes as klor_left.conf -- see CLAUDE.md. Without
# these the display crash-loops BT/USB or silently starves at LVGL's 2KB
# default mem pool once more than one styled object is on screen.
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
