# +8 dBm (nRF52840 max), both halves: ZMK docs' first fix for keys
# auto-repeating ("nnnnn") when a key-release report reaches the host late
# over BLE. Same fix as wireless-corne-zmk-config@078a77f.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# OLEDs blank on ZMK idle (stock BLANK_ON_IDLE); 5 s instead of the 30 s default.
# Each half counts its own keypresses, so one screen can blank while the other is in use.
CONFIG_ZMK_IDLE_TIMEOUT=5000

# Deep sleep (nRF System OFF) after 15 min idle (ZMK default); a keypress wakes
# the half (kscan wakeup-source) and it reconnects in a second or two.
CONFIG_ZMK_SLEEP=y
